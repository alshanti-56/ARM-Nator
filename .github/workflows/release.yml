name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish macOS release
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Verify Apple Silicon runner
        run: |
          test "$(uname -m)" = "arm64"
          node -p "process.platform + '-' + process.arch"

      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          package_version="$(node -p "require('./package.json').version")"
          expected_tag="v${package_version}"
          if [[ "${RELEASE_TAG}" != "${expected_tag}" ]]; then
            echo "Tag ${RELEASE_TAG} does not match package.json version ${package_version}."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and package ARM-Nator
        env:
          ARM_NATOR_ADHOC_SIGN: "1"
        run: pnpm package

      - name: Create checksums
        working-directory: dist/executables
        run: shasum -a 256 * > SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/executables/* \
            --verify-tag \
            --title "ARM-Nator ${GITHUB_REF_NAME#v}" \
            --generate-notes
