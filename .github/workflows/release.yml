name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to build and publish"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish macOS release
    runs-on: macos-26
    timeout-minutes: 90
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

    steps:
      - name: Check out release source
        uses: actions/checkout@v7.0.1
        with:
          # Tag pushes build the immutable tag. Manual reruns build the
          # selected branch so workflow fixes can rerun an existing release
          # without moving or rewriting its tag.
          ref: ${{ github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install pinned pnpm directly
        run: npm install --global --allow-scripts=pnpm "pnpm@$(node -p "require('./package.json').engines.pnpm")"

      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-arm64-pnpm-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Verify build environment
        run: node tools/verify-environment.mjs

      - name: Verify Apple Silicon runner
        run: |
          test "$(uname -m)" = "arm64"
          node -p "process.platform + '-' + process.arch"

      - name: Verify tag matches package version
        run: |
          package_version="$(node -p "require('./package.json').version")"
          expected_tag="v${package_version}"
          if [[ "${RELEASE_TAG}" != "${expected_tag}" ]]; then
            echo "Tag ${RELEASE_TAG} does not match package.json version ${package_version}."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install native runtime build tools
        run: |
          brew untap aws/tap 2>/dev/null || true
          HOMEBREW_NO_AUTO_UPDATE=1 brew install meson ninja pkg-config

      - name: Restore Embedded MPV cache
        uses: actions/cache@v6.1.0
        with:
          path: |
            vendor/embedded-mpv/darwin-arm64
            ${{ runner.temp }}/arm-nator-embedded-mpv-runtime/arm64/archives
          key: ${{ runner.os }}-macos-26-arm64-embedded-mpv-${{ hashFiles('tools/embedded-mpv/build-macos-runtime.mjs', 'tools/embedded-mpv/ensure-macos-runtime.mjs', 'tools/embedded-mpv/stage-macos-runtime.mjs') }}

      - name: Restore KSPlayer SwiftPM cache
        uses: actions/cache@v6.1.0
        with:
          path: apps/electron-backend/ksplayer-metal/.build
          key: ${{ runner.os }}-macos-26-arm64-ksplayer-${{ hashFiles('apps/electron-backend/ksplayer-metal/Package.swift', 'apps/electron-backend/ksplayer-metal/Package.resolved', 'apps/electron-backend/ksplayer-metal/Sources/**/*.swift', 'apps/electron-backend/build-ksplayer-metal.js', 'tools/packaging/ksplayer-metal-packaging.cjs', 'apps/electron-backend/native/binding.gyp') }}

      - name: Build and package ARM-Nator
        env:
          ARM_NATOR_ADHOC_SIGN: "1"
          ARM_NATOR_EMBEDDED_MPV_BUILD_ROOT: ${{ runner.temp }}/arm-nator-embedded-mpv-runtime/arm64
        run: pnpm package

      - name: Create checksums
        working-directory: dist/executables
        run: |
          : > SHA256SUMS.txt
          for artifact in *; do
            if [[ -f "${artifact}" && "${artifact}" != "SHA256SUMS.txt" ]]; then
              shasum -a 256 "${artifact}" >> SHA256SUMS.txt
            fi
          done

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifacts=()
          for artifact in dist/executables/*; do
            if [[ -f "${artifact}" ]]; then
              artifacts+=("${artifact}")
            fi
          done
          notes_args=(--generate-notes)
          if [[ -f "docs/releases/${RELEASE_TAG}.md" ]]; then
            notes_args+=(--notes-file "docs/releases/${RELEASE_TAG}.md")
          fi
          gh release create "${RELEASE_TAG}" "${artifacts[@]}" \
            --verify-tag \
            --title "ARM-Nator ${RELEASE_TAG#v}" \
            "${notes_args[@]}"
