<div
    #playerRoot
    class="art-player-shell art-player-shell--shared-controls"
>
    <div #artplayer class="artplayer-container"></div>

    <div class="art-player-interaction-capture" aria-hidden="true"></div>
    <app-player-controls
        [controller]="controlsAdapter"
        [playerSurface]="playerRoot"
        [mediaTitle]="mediaTitle()"
        [media]="controlsAdapter.mediaTelemetry()"
        [showControls]="interactionEnabled()"
        [shortcutsEnabled]="interactionEnabled()"
        (previousEpisodeRequested)="previousEpisodeRequested.emit()"
        (nextEpisodeRequested)="nextEpisodeRequested.emit()"
    />
</div>
