<nav class="rail-links">
    @for (link of links(); track link.path.join('/')) {
        <a
            class="portal-rail-link nav-item"
            [routerLink]="link.path"
            [routerLinkActive]="activeClass()"
            [routerLinkActiveOptions]="{ exact: link.exact ?? false }"
            [matTooltip]="link.tooltip"
            [matTooltipPosition]="'right'"
            [attr.aria-label]="link.tooltip"
            [attr.aria-current]="isActive(link) ? 'page' : null"
            [class.active]="activeClass() === 'active' && isActive(link)"
            [class.is-active]="
                activeClass() === 'is-active' && isActive(link)
            "
        >
            @if (isCustomIcon(link)) {
                <span class="arm-custom-icon" aria-hidden="true">&#xe901;</span>
            } @else if (isCompoundIcon(link)) {
                <span class="arm-compound-icon" aria-hidden="true">
                    <mat-icon>link</mat-icon>
                    <mat-icon class="arm-play-badge">play_arrow</mat-icon>
                </span>
            } @else {
                <mat-icon>{{ resolveIcon(link) }}</mat-icon>
                @if (isYouTubeIcon(link)) {
                    <span class="arm-icon-caption" aria-hidden="true">uYou +</span>
                }
            }
        </a>
    }
</nav>
