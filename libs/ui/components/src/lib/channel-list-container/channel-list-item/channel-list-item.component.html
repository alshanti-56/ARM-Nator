<div
    class="channel-list-item"
    cdkDrag
    [cdkDragDisabled]="!isDraggable()"
    cdkDragPreviewContainer="parent"
    [class.active]="selected()"
    (click)="onClick($event)"
    (dblclick)="onDoubleClick()"
    (contextmenu)="onContextMenu($event)"
    data-test-id="channel-item"
>
    @if (isDraggable()) {
        <mat-icon cdkDragHandle class="drag-icon">drag_indicator</mat-icon>
    }
    <div class="channel-content">
        <div class="channel-logo-shell" aria-hidden="true">
            @if (showLogoFallback()) {
                <mat-icon class="channel-logo-fallback">live_tv</mat-icon>
            }
            @if (logo()) {
                <img
                    class="channel-logo"
                    [src]="logo()"
                    (error)="onLogoError($event)"
                    alt="Channel Logo"
                />
            }
        </div>
        <div class="channel-details">
            <div class="channel-name">{{ displayName() }}</div>

        </div>
    </div>

</div>
