<div
    class="sidebar"
    [class.sidebar-collapsed]="isSidebarCollapsed()"
    appResizable
    [minWidth]="sidebarMinWidth"
    [maxWidth]="sidebarMaxWidth"
    [defaultWidth]="sidebarWidth()"
    [style.width.px]="sidebarWidth()"
    [storageKey]="sidebarStorageKey()"
    (widthChange)="onSidebarWidthChange($event)"
    (resizeEnd)="onSidebarResizeEnd($event)"
>
    @if (activeView() !== 'groups' && activeView() !== 'all') {
        <button
            mat-icon-button
            type="button"
            class="sidebar-collapse-toggle"
            [attr.aria-label]="'LAYOUT.HIDE_CHANNELS_LIST' | translate"
            [matTooltip]="'LAYOUT.TOGGLE_SIDEBAR_TOOLTIP' | translate"
            [attr.aria-pressed]="isSidebarCollapsed()"
            (click)="toggleSidebar()"
        >
            <mat-icon>chevron_left</mat-icon>
        </button>
    }
    @defer {
        <app-sidebar
            [channels]="(channels$ | async)!"
            [channelsLoading]="channelsLoading()"
            [showPlaylistHeader]="!isWorkspaceLayout"
            [activeView]="activeView()"
            [sidebarWidth]="sidebarWidth()"
            (sidebarWidthRequested)="onGroupedSidebarWidthRequested($event)"
            (sidebarWidthRequestEnded)="
                onGroupedSidebarWidthRequestEnded($event)
            "
            (sidebarToggleRequested)="toggleSidebar()"
        />
    } @loading {
        <app-channel-list-loading-state [view]="activeView()" />
    } @placeholder {
        <app-channel-list-loading-state [view]="activeView()" />
    }
</div>

<div class="content-container">
    @if (isSidebarCollapsed()) {
        <button
            mat-icon-button
            type="button"
            class="sidebar-restore"
            [attr.aria-label]="'LAYOUT.SHOW_CHANNELS_LIST' | translate"
            [matTooltip]="'LAYOUT.TOGGLE_SIDEBAR_TOOLTIP' | translate"
            [attr.aria-pressed]="isSidebarCollapsed()"
            (click)="toggleSidebar()"
        >
            <mat-icon>chevron_right</mat-icon>
        </button>
    }
    @if (activeChannel(); as activeChannel) {
        @if (activeChannel.radio === 'true') {
            <div class="video-player">
                <app-audio-player
                    [url]="activeChannel.url"
                    [icon]="activeChannel?.tvg?.logo!"
                    [channelName]="displayChannelName()"
                    [volume]="volume()"
                    (volumeChange)="onInlineVolumeChange($event)"
                />
            </div>
        }

        @if (showChannelNumberOverlay) {
            <div class="channel-number-overlay">
                <div class="channel-number-display">
                    {{ channelNumberInput }}
                </div>
            </div>
        }
    } @else {
        <app-portal-empty-state
            icon="live_tv"
            [message]="'CHANNELS.SELECT_CHANNEL_PLAYBACK' | translate"
        />
    }
</div>
