<div class="content-container">
    <div class="live-all-items-content category-content-layout">
            <div class="category-content-header">
                <div class="category-meta">
                    <h2 class="category-title">
                        {{ selectedCategoryInfo()?.name ?? 'All Items' }}
                    </h2>
                    <div class="category-subtitle">
                        {{ liveRootSubtitle() }}
                    </div>
                </div>

                <div class="category-header-actions">
                    <button
                        mat-icon-button
                        type="button"
                        [matMenuTriggerFor]="channelSortMenu"
                        [matTooltip]="'Sort: ' + liveChannelSortLabel()"
                        aria-label="Sort channels"
                    >
                        <mat-icon>sort_by_alpha</mat-icon>
                    </button>
                    <mat-menu #channelSortMenu="matMenu">
                        <button
                            mat-menu-item
                            (click)="setLiveChannelSortMode('server')"
                        >
                            <span>Server Order</span>
                            @if (liveChannelSortMode() === 'server') {
                                <mat-icon>check</mat-icon>
                            }
                        </button>
                        <button
                            mat-menu-item
                            (click)="setLiveChannelSortMode('name-asc')"
                        >
                            <span>Name A-Z</span>
                            @if (liveChannelSortMode() === 'name-asc') {
                                <mat-icon>check</mat-icon>
                            }
                        </button>
                        <button
                            mat-menu-item
                            (click)="setLiveChannelSortMode('name-desc')"
                        >
                            <span>Name Z-A</span>
                            @if (liveChannelSortMode() === 'name-desc') {
                                <mat-icon>check</mat-icon>
                            }
                        </button>
                    </mat-menu>

                    <div
                        class="view-toggle"
                        role="group"
                        aria-label="Live content view"
                    >
                        <button
                            mat-icon-button
                            type="button"
                            class="view-toggle-button"
                            [class.is-active]="liveViewMode() === 'grid'"
                            [attr.aria-pressed]="liveViewMode() === 'grid'"
                            matTooltip="Grid view"
                            aria-label="Grid view"
                            (click)="setLiveViewMode('grid')"
                        >
                            <mat-icon>grid_view</mat-icon>
                        </button>
                        <button
                            mat-icon-button
                            type="button"
                            class="view-toggle-button"
                            [class.is-active]="liveViewMode() === 'list'"
                            [attr.aria-pressed]="liveViewMode() === 'list'"
                            matTooltip="List view"
                            aria-label="List view"
                            (click)="setLiveViewMode('list')"
                        >
                            <mat-icon>view_list</mat-icon>
                        </button>
                    </div>
                </div>

                @if (showLiveRootPaginator()) {
                    <mat-paginator
                        [pageIndex]="liveRootPageIndex()"
                        [length]="liveRootItemCount()"
                        [pageSize]="liveRootLimit()"
                        [pageSizeOptions]="liveRootPageSizeOptions"
                        (page)="onLiveRootPageChange($event)"
                        aria-label="Select page"
                    />
                }
            </div>

            @if (isSelectedTypeContentLoading()) {
                <div class="live-loading-content">
                    <app-portal-channels-list
                        class="live-main-items-list"
                        [channelsOverride]="liveRootItems()"
                        [sortMode]="liveChannelSortMode()"
                        [searchTermInput]="workspaceSearchTerm()"
                        (playClicked)="playLive($event)"
                        (playbackRequested)="playLive($event, true)"
                    />
                </div>
            } @else if (liveViewMode() === 'grid') {
                <app-grid-list
                    class="live-all-items-grid app-scrollbar"
                    [isLoading]="isSelectedTypeContentLoading()"
                    [items]="liveRootItems()"
                    [pageIndex]="liveRootPageIndex()"
                    [totalPages]="liveRootTotalPages()"
                    [limit]="liveRootLimit()"
                    [pageSizeOptions]="liveRootPageSizeOptions"
                    [showPaginator]="false"
                    [searchTerm]="workspaceSearchTerm()"
                    [variant]="'logo'"
                    [type]="'live'"
                    (itemClicked)="onLiveRootItemClick($event)"
                />
            } @else {
                <app-portal-channels-list
                    class="live-main-items-list"
                    [channelsOverride]="liveRootItems()"
                    [sortMode]="liveChannelSortMode()"
                    [searchTermInput]="workspaceSearchTerm()"
                    (playClicked)="playLive($event)"
                    (playbackRequested)="playLive($event, true)"
                />
            }
    </div>
</div>
