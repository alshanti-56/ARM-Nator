saveExact: true
verifyDepsBeforeRun: error
enablePrePostScripts: true
pmOnFail: error
runtimeOnFail: error
engineStrict: true
strictPeerDependencies: true

# Compatibility patches validated by Angular playlist CRUD and Electron builds.
peerDependencyRules:
  allowedVersions:
    'ngx-indexed-db@22.0.0>@angular/common': '22.2.2'
    'ngx-indexed-db@22.0.0>@angular/core': '22.2.2'
    'nx-electron@22.0.0>@nx/devkit': '23.3.0'
    'nx-electron@22.0.0>@nx/workspace': '23.3.0'

packageExtensions:
  'nx-electron@22.0.0':
    dependencies:
      '@nx/js': '23.3.0'
      webpack-node-externals: '3.0.0'

allowBuilds:
  '@parcel/watcher': false
  '@swc/core': false
  esbuild: false
  electron-winstaller: false
  less: false
  lmdb: false
  msgpackr-extract: false
  unrs-resolver: false
  better-sqlite3: true
  electron: true
  nx: true
overrides:
  '@hono/node-server@1.19.9': 1.19.14
  '@xmldom/xmldom@0.8.11': 0.8.13
  'ajv@6.12.6': 6.14.0
  'ajv@8.17.1': 8.20.0
  'brace-expansion@1.1.12': 1.1.13
  'defu@6.1.4': 6.1.6
  'devalue@5.6.2': 5.6.4
  'express-rate-limit@8.2.1': 8.3.0
  'fast-uri@3.1.0': 3.1.4
  'flatted@3.3.3': 3.4.2
  'follow-redirects@1.15.11': 1.16.0
  'form-data@4.0.5': 4.0.6
  'h3@1.15.5': 1.15.10
  'hono@4.12.0': 4.12.14
  'immutable@5.1.4': 5.1.5
  'js-yaml@4.1.1': 4.3.0
  'lodash-es@4.17.22': 4.18.1
  'node-abi@3.85.0': 3.92.0
  'node-forge@1.3.3': 1.4.0
  'path-to-regexp@0.1.12': 0.1.13
  'picomatch@2.3.1': 2.3.2
  'rollup@4.52.3': 4.59.0
  'smol-toml@1.6.0': 1.6.1
  'svgo@3.3.2': 3.3.3
  'yaml@1.10.2': 1.10.3

patchedDependencies:
  nx-electron@22.0.0: patches/nx-electron@22.0.0.patch
minimumReleaseAgeExclude:
  - '@angular-eslint/builder@22.6.0'
  - '@angular-eslint/bundled-angular-compiler@22.6.0'
  - '@angular-eslint/eslint-plugin-template@22.6.0'
  - '@angular-eslint/eslint-plugin@22.6.0'
  - '@angular-eslint/schematics@22.6.0'
  - '@angular-eslint/template-parser@22.6.0'
  - '@angular-eslint/utils@22.6.0'
  - angular-eslint@22.6.0
